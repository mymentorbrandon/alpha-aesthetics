<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful | Alpha Aesthetics & Health</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #faf9f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 480px;
    }
    h1 { font-size: 22px; margin-bottom: 12px; }
    p { color: #555; line-height: 1.5; }
    .order {
      margin: 22px 0 0;
      border-top: 1px solid #e6e2dd;
      padding-top: 16px;
      text-align: left;
      font-size: 14px;
    }
    .order table { width: 100%; border-collapse: collapse; }
    .order td { padding: 5px 0; color: #444; }
    .order td.qty { text-align: center; color: #8a8a8a; width: 40px; }
    .order td.amt { text-align: right; white-space: nowrap; }
    .order tr.total td {
      border-top: 1px solid #e6e2dd;
      padding-top: 10px;
      font-weight: 700;
      color: #111;
    }
    .muted { color: #8a8a8a; font-size: 13px; }
    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="heading">Confirming your payment…</h1>
    <p id="blurb">One moment while we check with Stripe.</p>
    <div class="order" id="order" hidden></div>
    <p class="muted">Questions? Call us at <a href="tel:4706104550">(470) 610-4550</a>.</p>
    <a class="button" href="/index.html">Return to Home</a>
  </div>

<script>
/**
 * The page used to congratulate anyone who opened this URL, whether or not a
 * payment existed. It now asks Stripe about the session id it was redirected
 * with and shows the real order.
 */
(function () {
  const heading = document.getElementById('heading');
  const blurb = document.getElementById('blurb');
  const order = document.getElementById('order');

  const money = (cents, currency) =>
    new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: (currency || 'usd').toUpperCase(),
    }).format((cents || 0) / 100);

  function settle(title, text) {
    heading.textContent = title;
    blurb.textContent = text;
  }

  const sessionId = new URLSearchParams(location.search).get('session_id');
  if (!sessionId) {
    settle(
      'Thank you',
      "If you just paid, your receipt is on its way from Stripe. We'll follow up to confirm your appointment details."
    );
    return;
  }

  fetch('/api/checkout-session?session_id=' + encodeURIComponent(sessionId))
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error('lookup failed'))))
    .then((data) => {
      if (!data.paid) {
        settle(
          'Payment not completed',
          'Stripe has not confirmed this payment. Nothing has been charged — please try again or call us.'
        );
        return;
      }

      settle(
        '✅ Payment received — thank you!',
        'Your receipt is on its way from Stripe' +
          (data.email ? ' to ' + data.email : '') +
          ". We'll follow up shortly to confirm your appointment details."
      );

      const rows = data.items
        .map(
          (i) =>
            '<tr><td>' + i.name + '</td><td class="qty">x' + i.quantity +
            '</td><td class="amt">' + money(i.amountTotal, data.currency) + '</td></tr>'
        )
        .join('');
      order.innerHTML =
        '<table>' + rows +
        '<tr class="total"><td>Total</td><td></td><td class="amt">' +
        money(data.amountTotal, data.currency) + '</td></tr></table>';
      order.hidden = false;
    })
    .catch(() => {
      // Never leave the buyer staring at "Confirming…" — the payment itself is
      // safe in Stripe regardless of whether this lookup worked.
      settle(
        'Thank you',
        "We couldn't load the order summary, but your payment went through and your receipt is on its way from Stripe."
      );
    });
})();
</script>
</body>
</html>
